name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true
          # Disable configuration cache in CI — it occasionally trips up the
          # Vanniktech publish plugin's property-driven configuration.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew build jacocoTestReport --no-configuration-cache --stacktrace

      - name: Upload coverage to Codecov
        if: success() && github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          # Coverage now lives under the `core` subproject's build dir.
          # Glob handles additional published subprojects automatically.
          files: ./core/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: false   # don't break CI if Codecov upload glitches
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          # `**` so any future subproject's test output is also captured.
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/jacoco/
          retention-days: 7

  # Dialect-compat layer: runs the @Tag("dialect-compat") tests against real
  # PostgreSQL + MySQL via Testcontainers. Separated from `build` so a failing
  # container start doesn't block the fast feedback loop, and so the slower
  # job runs in parallel with the main build.
  dialect-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run dialect-compat tests
        # Ubuntu runners ship with Docker pre-installed and the daemon already
        # running at the default Unix socket — Testcontainers auto-detects it
        # with no extra config.
        run: ./gradlew testDialect --no-configuration-cache --stacktrace

      - name: Upload dialect test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dialect-test-report
          path: |
            **/build/reports/tests/testDialect/
            **/build/test-results/testDialect/
          retention-days: 7
