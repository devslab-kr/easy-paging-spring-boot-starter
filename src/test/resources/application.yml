spring:
  datasource:
    url: jdbc:h2:mem:easy-paging-it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true

easy-paging:
  default-page-size: 20
  max-page-size: 200
  keyset:
    cursor-secret: "test-secret-do-not-use-in-prod"
    max-cursor-bytes: 2048

logging:
  level:
    kr.devslab.easypaging: DEBUG
    org.springframework.boot.autoconfigure: WARN
